id = "amd-abm-washed-out"
title = "AMD laptop: colors look washed out on power saving"
summary = "Panel Power Savings lowers color accuracy and contrast on AMD laptops to save power. TuneD's battery profiles turn it on, and so does power-profiles-daemon when its amdgpu_panel_power action is enabled. Turning it off restores normal colors at a small battery cost."
categories = ["amd", "display", "sleep"]
systems = ["arch-and-based"]
keywords = ["amdgpu.abmlevel", "abm", "panel power savings", "pps", "power-profiles-daemon", "tuned", "washed out colors"]
symptoms = ["colors look washed out on my amd laptop", "screen looks dim and faded on battery", "contrast drops in power saver mode", "colors change when unplugging the charger"]
source = "https://wiki.archlinux.org/title/AMDGPU#Colors_appear_washed_out_and_dim_on_laptops"

[[when]]
source = "module"
names = ["amdgpu"]

[[when]]
source = "file"
path = "/sys/class/dmi/id/chassis_type"
regex = '^(8|9|10|14|31|32)$'

[[fixed_when]]
source = "kernel_param"
params = ["amdgpu.abmlevel=0"]

# The driver only offers this file while abmlevel is left on auto. It reads 0 on AC power,
# so it shows the problem only while it's happening.
[[signals]]
says = "Panel Power Savings is on right now"
weight = 0.6
source = "file"
path = "/sys/class/drm/card*-eDP-*/amdgpu/panel_power_savings"
regex = '^[1-4]$'

# power-profiles-daemon 0.30 leaves its panel power action off unless you enable it.
[[signals]]
says = "TuneD is installed, and its battery profiles turn on Panel Power Savings"
weight = 0.3
source = "package"
names = ["tuned", "tuned-ppd"]

[[fix]]
reboot = true
steps = [
  { op = "kernel_params", add = ["amdgpu.abmlevel=0"], says = "Add a kernel parameter that turns off Panel Power Savings" },
  { op = "initramfs" },
]
