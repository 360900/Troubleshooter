id = "amd-vulkan-missing"
title = "AMD: Vulkan driver is missing"
summary = "Proton, DXVK and most modern games need Vulkan. Without AMD's Vulkan driver they won't start or run far too slowly."
categories = ["amd", "games", "wine", "drivers"]
systems = ["arch-and-based"]
keywords = ["vulkan-radeon", "radv", "mesa", "dxvk", "vulkan"]
symptoms = ["game won't start on my radeon card", "dxvk fails on amd", "proton games don't launch", "vulkan not found", "no vulkan device"]
auto_detect = true
source = "https://wiki.archlinux.org/title/Vulkan#Installation"

[[when]]
source = "pci"
vendor = "1002"
class = "03"
driver = "amdgpu"

[[fixed_when]]
source = "package"
names = ["vulkan-radeon", "amdvlk"]

# Covers mesa-git and other builds that ship RADV under another package name.
[[fixed_when]]
source = "file"
path = "/usr/share/vulkan/icd.d/radeon_icd*.json"

# A missing driver only matters once something uses Vulkan, so it alone stays low.
[[signals]]
says = "You have an AMD GPU, but no AMD Vulkan driver"
weight = 0.4
source = "package"
names = ["vulkan-radeon", "amdvlk"]
absent = true

[[signals]]
says = "Games or Windows apps are installed, and they need Vulkan"
weight = 0.8
source = "package"
names = ["steam", "lutris", "heroic-games-launcher*", "bottles", "wine", "wine-*", "proton*", "umu-launcher", "gamescope*"]

[[signals]]
says = "The software Vulkan driver is installed, so Vulkan apps can end up running on the CPU"
weight = 0.6
source = "package"
names = ["vulkan-swrast"]

# Games run on the other card here, which has its own Vulkan driver.
[[signals]]
says = "Another graphics card with its own Vulkan driver runs the games"
weight = 0.6
counter = true
source = "pci"
vendor = "10de"
class = "03"
driver = "nvidia"

[[fix]]
steps = [{ op = "install", packages = ["vulkan-radeon"], optional = { "lib32-vulkan-radeon" = ["steam", "wine", "wine-*", "lib32-mesa"] }, says = "Install AMD's Vulkan driver (RADV)" }]
