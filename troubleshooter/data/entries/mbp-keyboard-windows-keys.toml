id = "mbp-keyboard-windows-keys"
title = "MacBook Pro 2016-2017: Windows-style modifier keys in KDE"
summary = "Puts the left modifier keys in Windows order (Ctrl, Fn, Win, Alt) and makes right Command and right Option both work as AltGr, in KDE Plasma. Applies to you and as the default for new users. Undo removes all keyboard settings made by mbp132-setup."
categories = ["input", "desktop"]
systems = ["arch-and-based"]
keywords = ["altgr", "command key", "option key", "super", "xkb", "altwin:swap_lalt_lwin", "lv3:rwin_switch", "kxkbrc", "mbp132-setup"]
symptoms = ["alt and command keys are in the wrong place", "no altgr on my macbook", "make macbook keyboard work like windows", "can't type @ on macbook keyboard"]
source = "https://github.com/360900/mbp132-setup#what-it-fixes-and-why"

[[when]]
source = "file"
path = "/sys/class/dmi/id/product_name"
regex = '^MacBookPro1(3,[123]|4,[123])$'

[[when]]
source = "env"
name = "XDG_CURRENT_DESKTOP"
regex = '=(.*:)?KDE(:|$)'

[[fixed_when]]
source = "file"
path = "~/.config/kxkbrc"
regex = '^Options=.*altwin:swap_lalt_lwin.*lv3:rwin_switch'

[[fix]]
steps = [
  { op = "run_from_repo", repo = "https://github.com/360900/mbp132-setup", commit = "dad1e086ed196338b8ed2ef9a898ac3fbe342c14", script = "mbp132-setup-cli.sh", args = ["--no-audio", "--no-touchbar", "--no-sleep", "--no-wifi", "--no-grub", "--windows-keys"], undo_args = ["--uninstall", "--no-audio", "--no-touchbar", "--no-sleep", "--no-wifi", "--no-grub"], says = "Set Windows-style modifier keys with mbp132-setup (pinned version, downloaded from GitHub)" },
]
