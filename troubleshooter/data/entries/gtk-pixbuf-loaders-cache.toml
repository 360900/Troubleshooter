id = "gtk-pixbuf-loaders-cache"
title = "GTK apps: SVG icons missing after an update"
summary = "GTK loads images through gdk-pixbuf, which keeps a cache of its image loaders. If that cache is stale after an upgrade, SVG icons such as Breeze stop showing in GTK apps. Rebuilding the cache is quick and harmless."
categories = ["desktop"]
systems = ["arch-and-based"]
keywords = ["gdk-pixbuf", "gdk-pixbuf-query-loaders", "loaders.cache", "librsvg", "svg", "breeze icons", "icon theme"]
symptoms = ["gtk apps lost their icons", "icons missing after update", "svg icons don't load", "breeze icons not showing in gtk apps", "broken icons in gimp"]
source = "https://wiki.archlinux.org/title/Uniform_look_for_Qt_and_GTK_applications#GTK_applications_do_not_use_svg_(breeze)_icons_after_system_upgrade"

[[when]]
source = "package"
names = ["gdk-pixbuf2"]

[[fix]]
steps = [{ op = "command", run = "gdk-pixbuf-query-loaders --update-cache", says = "Rebuild the gdk-pixbuf image loader cache" }]
