id = "portal-kde-missing"
title = "KDE Plasma: desktop portal is missing"
summary = "Plasma's portal backend isn't installed. Without it, screen sharing, file dialogs in Flatpak apps and opening links from sandboxed apps don't work properly."
categories = ["desktop"]
systems = ["arch-and-based"]
keywords = ["xdg-desktop-portal-kde", "xdg-desktop-portal", "portal", "screencast", "pipewire", "file chooser"]
symptoms = ["screen sharing doesn't work on kde", "can't share my screen in discord", "file dialog doesn't open in flatpak app", "links don't open from flatpak apps", "screen share shows black on plasma"]
auto_detect = true
source = "https://wiki.archlinux.org/title/XDG_Desktop_Portal#List_of_backends_and_interfaces"

[[when]]
source = "env"
name = "XDG_CURRENT_DESKTOP"
regex = '=(.*:)?KDE(:|$)'

[[when]]
source = "package"
names = ["plasma-workspace"]

[[fixed_when]]
source = "package"
names = ["xdg-desktop-portal-kde"]

[[signals]]
says = "Plasma is installed, but its portal backend isn't"
weight = 0.85
source = "package"
names = ["xdg-desktop-portal-kde"]
absent = true

[[fix]]
steps = [{ op = "install", packages = ["xdg-desktop-portal-kde"], says = "Install the KDE desktop portal" }]
