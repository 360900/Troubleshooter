id = "bluetooth-audio-stutter"
title = "Bluetooth audio: playback stutters"
summary = "PipeWire couldn't keep the Bluetooth stream fed. A weak link or a demanding codec is the usual cause, and Wi-Fi on the same chip or nearby 2.4 GHz traffic makes it worse."
categories = ["bluetooth", "sound"]
systems = ["any"]
keywords = ["client too slow", "bluez5.codecs", "sbc", "sbc_xq", "ldac", "aac", "aptx", "codec", "coexistence", "2.4 ghz"]
symptoms = ["bluetooth audio stutters", "bluetooth headphones cut out", "bluetooth sound skips", "choppy bluetooth audio", "bluetooth music crackles"]
source = "https://wiki.archlinux.org/title/PipeWire/Troubleshooting#Low_audio_quality_on_Bluetooth"
advice = "Pick a lighter codec for the headphones (for example SBC or AAC instead of LDAC) in your sound settings or pavucontrol's Configuration tab. If your Wi-Fi and Bluetooth share a chip, connect the Wi-Fi on 5 GHz. Also stop any Bluetooth scan that keeps running in the background."

[[when]]
source = "package"
names = ["pipewire-audio"]

# No log evidence: PipeWire reports xruns ("XRun!", "graph xrun", older "client too slow")
# only at info level, below its default warning level, so they never reach the journal.
