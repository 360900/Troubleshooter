id = "amd-gfxoff-freeze"
title = "AMD: system freezes or reboots while idle"
summary = "GFXOFF, a power-saving feature that switches off the graphics core when idle, can crash the amdgpu driver, often with several monitors or after sleep. Turning off just that feature fixes it, at a small idle power cost."
categories = ["amd", "crashes", "display"]
systems = ["arch-and-based"]
keywords = ["gfxoff", "amdgpu.ppfeaturemask", "PP_GFXOFF_MASK", "powerplay", "idle freeze", "multi-monitor"]
symptoms = ["pc freezes when idle with amd", "computer reboots by itself when not in use", "screen freezes after waking from sleep on radeon", "crashes with two monitors on amd"]
reproduce = "Leave the computer idle, or put it to sleep and wake it, until it freezes. Then restart and run this again."
source = "https://wiki.archlinux.org/title/AMDGPU#System_freezes_or_reboots_when_idle"

[[when]]
source = "module"
names = ["amdgpu"]

# Someone who set their own mask that keeps GFXOFF (0x8000) on, for overclocking, should
# choose the bits themselves. A hex mask has GFXOFF off when its fourth digit from the
# right is 0-7.
[[when]]
source = "cmdline"
regex = '^amdgpu\.ppfeaturemask=(?!0x(?:[0-9a-f]*[0-7][0-9a-f]{3}|[0-9a-f]{1,3})$)'
absent = true

# Any mask without GFXOFF counts, including 0xffff7fff from older versions of this fix.
[[fixed_when]]
any_of = [
  { source = "kernel_param", params = ["amdgpu.ppfeaturemask=0xfff73fff"] },
  { source = "kernel_param", params = ["amdgpu.ppfeaturemask=0xffff7fff"] },
  { source = "cmdline", regex = '^amdgpu\.ppfeaturemask=0x(?:[0-9a-f]*[0-7][0-9a-f]{3}|[0-9a-f]{1,3})$' },
]

[[signals]]
says = "The kernel log shows amdgpu timeouts or GPU resets"
weight = 0.4
source = "journal"
kernel = true
regex = 'amdgpu.*(ring .* timeout|GPU reset begin)'

[[fix]]
reboot = true
steps = [
  # The driver default (0xfff7bfff) without GFXOFF. 0xffff7fff would also turn on Overdrive,
  # which taints the kernel, and the experimental GFX_DCS feature.
  { op = "kernel_params", add = ["amdgpu.ppfeaturemask=0xfff73fff"], says = "Add a kernel parameter that turns off GFXOFF and keeps the other default power features" },
  { op = "initramfs" },
]
