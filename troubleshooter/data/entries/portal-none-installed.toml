id = "portal-none-installed"
title = "Desktop portal: no backend installed"
summary = "No desktop portal backend is installed. Apps that rely on portals, like Firefox's download dialog and Flatpak apps, then can't show file pickers or open links. The GTK portal is a good general fallback."
categories = ["desktop"]
systems = ["arch-and-based"]
keywords = ["xdg-desktop-portal", "xdg-desktop-portal-gtk", "portal", "file chooser", "window manager", "i3"]
symptoms = ["firefox download dialog doesn't open", "save as dialog never appears", "file picker doesn't show up", "flatpak apps can't open files", "links don't open from apps"]
source = "https://wiki.archlinux.org/title/Firefox#File_dialogs_do_not_open_when_downloading_files"

[[when]]
any_of = [
  { source = "file", path = "/usr/share/xsessions/*.desktop" },
  { source = "file", path = "/usr/share/wayland-sessions/*.desktop" },
]

# Plasma and GNOME have their own entries.
[[when]]
source = "package"
names = ["plasma-workspace", "gnome-shell"]
absent = true

[[fixed_when]]
source = "package"
names = ["xdg-desktop-portal-*"]

[[signals]]
says = "No desktop portal backend is installed"
weight = 0.7
source = "package"
names = ["xdg-desktop-portal-*"]
absent = true

[[fix]]
steps = [{ op = "install", packages = ["xdg-desktop-portal", "xdg-desktop-portal-gtk"], says = "Install the desktop portal with its GTK backend" }]
