id = "nvidia-open-on-legacy"
title = "This NVIDIA card needs the legacy 580xx driver"
summary = "NVIDIA dropped Maxwell and Pascal cards (GTX 750 to GTX 10xx) from driver 590 onward, and the open kernel driver never supported them. The installed driver can't load on this card."
categories = ["nvidia", "drivers", "display"]
systems = ["arch-and-based"]
keywords = ["nvidia-580xx-dkms", "580xx", "legacy driver", "maxwell", "pascal", "gtx 1080", "gtx 1070", "gtx 1060", "gtx 1050", "gtx 970", "gtx 960"]
symptoms = ["black screen after nvidia update", "no display after updating", "driver won't load after update", "nvidia stopped working after upgrade", "card no longer supported"]
auto_detect = true
source = "https://wiki.archlinux.org/title/NVIDIA#Installation"

[[when]]
source = "pci"
vendor = "10de"
class = "03"
devices = ["1340-1dff"]

# With a Turing or newer card next to it, the swap would downgrade that card's driver.
[[when]]
source = "pci"
vendor = "10de"
class = "03"
devices = ["1e00-ffff"]
absent = true

[[when]]
source = "package"
names = ["nvidia", "nvidia-dkms", "nvidia-lts", "nvidia-open", "nvidia-open-dkms", "nvidia-580xx-open-dkms", "nvidia-open-lts", "linux-*-nvidia-open", "linux-*-nvidia"]

[[fixed_when]]
source = "package"
names = ["nvidia-580xx-dkms"]

# A closed driver (such as an older nvidia-dkms) is running the card, so it does support it.
[[fixed_when]]
all_of = [
  { source = "pci", vendor = "10de", class = "03", devices = ["1340-1dff"], driver = "nvidia" },
  { source = "package", names = ["nvidia-open", "nvidia-open-dkms", "nvidia-580xx-open-dkms", "nvidia-open-lts", "linux-*-nvidia-open"], absent = true },
]

[[signals]]
says = "A driver that doesn't support this card is installed"
weight = 0.95
source = "package"
names = ["nvidia-open", "nvidia-open-dkms", "nvidia-580xx-open-dkms", "nvidia-open-lts", "linux-*-nvidia-open"]

[[signals]]
says = "The NVIDIA driver rejected this card at boot"
weight = 0.9
source = "journal"
kernel = true
# nv-pci.c, nv.c and the RM's messages for a card the driver won't take; generic
# "not supported" lines like "FLR not supported" are left out on purpose.
regex = 'NVRM: .*(is not supported by open|supported through the NVIDIA \d+\.xx Legacy drivers|ignoring the legacy GPU|No NVIDIA GPU found)|nvidia \S+: probe with driver nvidia failed|nvidia: probe of \S+ failed'

[[fix]]
reboot = true
steps = [
  { op = "install_aur", packages = ["nvidia-580xx-dkms", "nvidia-580xx-utils", "{headers}"], optional = { "lib32-nvidia-580xx-utils" = "lib32-nvidia-utils", "opencl-nvidia-580xx" = "opencl-nvidia" }, aur_bases = { "nvidia-580xx-dkms" = "nvidia-580xx-utils", "nvidia-580xx-utils" = "nvidia-580xx-utils", "opencl-nvidia-580xx" = "nvidia-580xx-utils", "lib32-nvidia-580xx-utils" = "lib32-nvidia-580xx-utils" }, replaces = ["nvidia", "nvidia-dkms", "nvidia-lts", "nvidia-open", "nvidia-open-dkms", "nvidia-580xx-open-dkms", "nvidia-open-lts", "linux-*-nvidia-open", "linux-*-nvidia", "nvidia-utils", "lib32-nvidia-utils", "opencl-nvidia", "lib32-opencl-nvidia"] },
  { op = "initramfs" },
]
