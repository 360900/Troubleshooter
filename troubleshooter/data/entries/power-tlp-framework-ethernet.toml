id = "power-tlp-framework-ethernet"
title = "Framework Ethernet card stops working with TLP"
summary = "TLP puts USB devices into power saving, which cuts out the Framework Ethernet expansion card (Realtek RTL8156). Excluding that card from USB power saving fixes it."
categories = ["network", "sleep"]
systems = ["arch-and-based"]
keywords = ["tlp", "usb_denylist", "0bda:8156", "rtl8156", "framework ethernet", "usb autosuspend", "r8152"]
symptoms = ["ethernet expansion card doesn't work", "wired connection drops on framework", "usb ethernet adapter stops working", "ethernet only works when plugged in"]
source = "https://wiki.archlinux.org/title/Framework_Laptop_13#Ethernet_not_working_with_tlp"

[[when]]
source = "usb"
vendor = "0bda"
devices = ["8156"]

[[when]]
source = "package"
names = ["tlp"]

# TLP only reads NAME=value or NAME+=value at the start of a line, without spaces
# (tlp-readconfs). Turning USB autosuspend off altogether also keeps the card awake.
[[fixed_when]]
source = "file"
path = "/etc/tlp.d/*.conf"
regex = '^USB_DENYLIST\+?="?[^"#]*0bda:8156'

[[fixed_when]]
source = "file"
path = "/etc/tlp.conf"
regex = '^USB_DENYLIST\+?="?[^"#]*0bda:8156'

[[fixed_when]]
any_of = [
  { source = "file", path = "/etc/tlp.d/*.conf", regex = '^USB_AUTOSUSPEND="?0"?\s*(#|$)' },
  { source = "file", path = "/etc/tlp.conf", regex = '^USB_AUTOSUSPEND="?0"?\s*(#|$)' },
]

[[signals]]
says = "TLP is enabled and manages USB power saving"
weight = 0.45
source = "service"
name = "tlp.service"
state = "enabled"

# += keeps devices other drop-ins already deny (https://linrunner.de/tlp/settings/introduction.html).
[[fix]]
steps = [
  { op = "write_file", path = "/etc/tlp.d/90-troubleshooter-usb-ethernet.conf", content = "USB_DENYLIST+=\"0bda:8156\"\n", says = "Exclude the Ethernet card from TLP's USB power saving" },
  { op = "command", says = "Apply the TLP settings", run = "tlp start", undo = "tlp start" },
]
