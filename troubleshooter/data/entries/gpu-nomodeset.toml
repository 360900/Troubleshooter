id = "gpu-nomodeset"
title = "Graphics: nomodeset is turning off the graphics driver"
summary = "The nomodeset kernel parameter stops the graphics driver from loading, which leaves you with a slow, unaccelerated desktop, no Wayland and often the wrong resolution. It's usually left over from installing."
categories = ["display", "drivers"]
systems = ["any"]
keywords = ["nomodeset", "kms", "kernel mode setting", "kernel parameter", "simpledrm", "software rendering", "llvmpipe"]
symptoms = ["screen resolution is wrong", "desktop is very slow", "only one resolution available", "graphics driver not loading", "no wayland session", "games run on llvmpipe"]
auto_detect = true
advice = "Remove nomodeset from your boot loader's kernel parameters: in GRUB edit GRUB_CMDLINE_LINUX_DEFAULT in /etc/default/grub and run `grub-mkconfig -o /boot/grub/grub.cfg`, in systemd-boot edit the options line in your entry under /boot/loader/entries. Then reboot."
source = "https://wiki.archlinux.org/title/Intel_graphics#Loading"

[[when]]
source = "pci"
class = "03"

[[signals]]
says = "The kernel was started with nomodeset"
weight = 0.9
source = "cmdline"
regex = '^nomodeset$'
