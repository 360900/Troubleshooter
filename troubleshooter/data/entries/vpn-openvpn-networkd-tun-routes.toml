id = "vpn-openvpn-networkd-tun-routes"
title = "VPN: OpenVPN can't add its routes with systemd-networkd"
summary = "systemd-networkd grabs the VPN's tun interface while OpenVPN is still setting it up, so adding the VPN routes fails and traffic doesn't go through the tunnel. Telling systemd-networkd to leave tun interfaces alone fixes it."
categories = ["network"]
systems = ["arch-and-based"]
keywords = ["openvpn", "systemd-networkd", "tun0", "Unmanaged", "redirect-gateway", "route add command failed", "RTNETLINK answers"]
symptoms = ["vpn connects but no traffic goes through it", "openvpn route add failed", "rtnetlink answers network is unreachable", "openvpn doesn't route all traffic"]
auto_detect = true
reproduce = "Start the OpenVPN connection again."
source = "https://wiki.archlinux.org/title/OpenVPN#Route_configuration_fails_with_systemd-networkd"

[[when]]
source = "package"
names = ["openvpn"]

[[when]]
source = "service"
name = "systemd-networkd.service"
state = "enabled"

[[fixed_when]]
source = "file"
path = "/etc/systemd/network/90-tun-ignore.network"

[[signals]]
says = "OpenVPN failed to add a route"
weight = 0.6
source = "journal"
regex = 'openvpn.*Linux route add command failed'

[[signals]]
says = "OpenVPN was told the network is unreachable while setting up routes"
weight = 0.2
source = "journal"
regex = 'openvpn.*RTNETLINK answers: Network is unreachable'

[[fix]]
steps = [
  { op = "write_file", path = "/etc/systemd/network/90-tun-ignore.network", content = "[Match]\nName=tun*\n\n[Link]\nUnmanaged=true\n", says = "Tell systemd-networkd not to manage tun interfaces" },
  { op = "command", says = "Restart systemd-networkd (the network blinks briefly), then reconnect the VPN", run = "systemctl try-restart systemd-networkd.service", undo = "systemctl try-restart systemd-networkd.service" },
]
