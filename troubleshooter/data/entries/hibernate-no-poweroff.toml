id = "hibernate-no-poweroff"
title = "Hibernate doesn't turn the computer off"
summary = "On some firmware the hibernate power state doesn't work, so the computer reboots or stays on after saving. Telling systemd to shut down normally after saving fixes it."
categories = ["sleep"]
systems = ["any"]
keywords = ["hibernate", "HibernateMode", "shutdown", "sleep.conf", "S4", "reboots instead of hibernating"]
symptoms = ["computer reboots instead of hibernating", "laptop stays on after hibernate", "hibernate doesn't power off", "wrong os boots after hibernate", "operating system not found after hibernate"]
source = "https://wiki.archlinux.org/title/Power_management/Suspend_and_hibernate#System_does_not_power_off_when_hibernating"

[[when]]
source = "file"
path = "/sys/power/disk"

[[fixed_when]]
source = "file"
path = "/etc/systemd/sleep.conf.d/*.conf"
regex = '^\s*HibernateMode\s*=\s*shutdown'

[[fix]]
steps = [{ op = "write_file", path = "/etc/systemd/sleep.conf.d/troubleshooter-hibernatemode.conf", content = "[Sleep]\nHibernateMode=shutdown\n", says = "Make hibernate shut the computer down after saving" }]
