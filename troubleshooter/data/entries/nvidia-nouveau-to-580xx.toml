id = "nvidia-nouveau-to-580xx"
title = "Older NVIDIA card is using nouveau"
summary = "On Maxwell and Pascal cards (GTX 750 to GTX 10xx), nouveau is stuck at low clock speeds. NVIDIA's legacy 580xx driver gives you the card's full performance and Vulkan."
categories = ["nvidia", "drivers", "games"]
systems = ["arch-and-based"]
keywords = ["nouveau", "nvidia-580xx-dkms", "580xx", "legacy driver", "maxwell", "pascal", "reclocking", "gtx 1080", "gtx 1060", "gtx 970"]
symptoms = ["games are very slow on my gtx card", "low fps on an old nvidia card", "nvidia driver not installed"]
auto_detect = true
source = "https://wiki.archlinux.org/title/NVIDIA#Installation"

[[when]]
source = "pci"
vendor = "10de"
class = "03"
devices = ["1340-1dff"]

[[fixed_when]]
source = "package"
names = ["nvidia-580xx-dkms"]

[[signals]]
says = "Your NVIDIA card is being driven by nouveau"
weight = 0.9
source = "pci"
vendor = "10de"
class = "03"
devices = ["1340-1dff"]
driver = "nouveau"

[[fix]]
reboot = true
steps = [
  { op = "install_aur", packages = ["nvidia-580xx-dkms", "nvidia-580xx-utils", "{headers}"], optional = { "lib32-nvidia-580xx-utils" = ["steam", "wine", "wine-*", "lutris"] }, aur_bases = { "nvidia-580xx-dkms" = "nvidia-580xx-utils", "nvidia-580xx-utils" = "nvidia-580xx-utils", "lib32-nvidia-580xx-utils" = "lib32-nvidia-580xx-utils" }, replaces = ["xf86-video-nouveau"] },
  { op = "initramfs" },
]
