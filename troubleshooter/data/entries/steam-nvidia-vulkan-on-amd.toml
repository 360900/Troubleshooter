id = "steam-nvidia-vulkan-on-amd"
title = "Steam: NVIDIA's 32-bit driver is installed on an AMD system"
summary = "When Steam is installed, pacman picks lib32-nvidia-utils as the 32-bit Vulkan driver unless you choose another. On an AMD card that driver can't work, and it can break Vulkan in games. The fix swaps it for AMD's 32-bit Vulkan driver."
categories = ["games", "amd", "wine"]
systems = ["arch-and-based"]
keywords = ["lib32-nvidia-utils", "lib32-vulkan-radeon", "lib32-vulkan-driver", "vulkan", "dxvk", "DxvkError"]
symptoms = ["games won't start on my amd card", "vulkan doesn't work in steam", "dxvk error when starting a game", "proton games crash right away", "steam installed the nvidia driver"]
auto_detect = true
source = "https://wiki.archlinux.org/title/Steam#Installation"

[[when]]
source = "pci"
vendor = "1002"
class = "03"
driver = "amdgpu"

[[when]]
source = "pci"
vendor = "10de"
class = "03"
absent = true

[[when]]
source = "package"
names = ["lib32-nvidia-utils", "lib32-nvidia-*-utils"]

[[signals]]
says = "lib32-nvidia-utils is installed, but there is no NVIDIA card"
weight = 0.85
source = "package"
names = ["lib32-nvidia-utils", "lib32-nvidia-*-utils"]

[[signals]]
says = "A game crashed with a DXVK error"
weight = 0.5
source = "journal"
regex = "terminate called after throwing an instance of 'dxvk::DxvkError'"

[[fix]]
steps = [
  { op = "install", packages = ["vulkan-radeon", "lib32-vulkan-radeon"], says = "Install AMD's 64-bit and 32-bit Vulkan drivers" },
  { op = "remove", packages = ["lib32-nvidia-utils", "lib32-nvidia-*-utils"], says = "Remove the NVIDIA 32-bit driver" },
]
