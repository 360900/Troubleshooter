id = "vbox-driver-not-loaded"
title = "VirtualBox: the kernel driver isn't loaded"
summary = "VirtualBox needs its vboxdrv kernel module before any virtual machine can start, and it isn't loaded right now. This usually happens right after installing VirtualBox, before the first restart."
categories = ["vms", "drivers"]
systems = ["arch-and-based"]
keywords = ["vboxdrv", "vboxnetadp", "vboxnetflt", "virtualbox-host-dkms", "rc=-1908", "modprobe", "modules-load.d"]
symptoms = ["kernel driver not installed rc=-1908", "virtualbox vm won't start", "virtualbox says the kernel module is not loaded", "virtualbox error after install", "failed to create the host-only network interface"]
auto_detect = true
source = "https://wiki.archlinux.org/title/VirtualBox#Load_the_VirtualBox_kernel_modules"

[[when]]
source = "package"
names = ["virtualbox"]

[[fixed_when]]
source = "module"
names = ["vboxdrv"]

[[signals]]
says = "VirtualBox is installed but vboxdrv isn't loaded"
weight = 0.7
source = "module"
names = ["vboxdrv"]
absent = true

[[signals]]
says = "The kernel refused an unsigned module, so loading it by hand won't help"
weight = 0.6
counter = true
any_of = [
  { source = "journal", kernel = true, regex = 'Loading of (unsigned module|module with unavailable key) is rejected|Lockdown: \S+: unsigned module loading is restricted' },
  { source = "journal", identifier = "systemd-modules-load", regex = "Failed to insert module 'vbox(drv|netadp|netflt)': (Key was rejected by service|Required key not available|Operation not permitted)" },
]

# Stays true after the log lines above have rotated away.
[[signals]]
says = "The kernel only loads signed modules, so loading it by hand may not help"
weight = 0.5
counter = true
any_of = [
  { source = "file", path = "/sys/module/module/parameters/sig_enforce", regex = '^Y' },
  { source = "file", path = "/sys/kernel/security/lockdown", regex = '\[(integrity|confidentiality)\]' },
]

# systemd-modules-load tries the modules virtualbox-host-dkms lists at every boot. Not found
# means DKMS didn't build them for this kernel, or the kernel was updated since.
[[signals]]
says = "vboxdrv isn't built for the running kernel, so loading it by hand won't help"
weight = 0.6
counter = true
source = "journal"
regex = "Failed to find module 'vbox(drv|netadp|netflt)'|Module vbox(drv|netadp|netflt) not found in directory /(usr/)?lib/modules/"

[[fix]]
steps = [{ op = "command", says = "Load the VirtualBox kernel modules", run = "modprobe -a vboxdrv vboxnetadp vboxnetflt" }]
