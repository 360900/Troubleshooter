id = "firmware-missing"
title = "A device is missing its firmware"
summary = "The kernel tried to load firmware for a device and couldn't find it, so that device may not work properly."
categories = ["drivers", "network", "sound", "bluetooth"]
systems = ["arch-and-based", "fedora-and-based"]
keywords = ["linux-firmware", "firmware", "direct firmware load", "failed to load firmware"]
symptoms = ["device doesn't work", "wifi not detected", "bluetooth adapter is missing", "no sound after update"]

[[signals]]
says = "The kernel log shows firmware that failed to load"
weight = 0.7
source = "journal"
kernel = true
regex = 'Direct firmware load for .* failed|firmware: failed to load|failed to load firmware'

[[fix]]
systems = ["arch-and-based"]
reboot = true
steps = [{ op = "install", packages = ["linux-firmware"] }]

[[fix]]
systems = ["fedora-and-based"]
reboot = true
steps = [{ op = "install", packages = ["linux-firmware"] }]
