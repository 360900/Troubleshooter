id = "updates-package-cache-full"
title = "Disk: old packages are filling up the disk"
summary = "pacman keeps every package version it ever downloaded in /var/cache/pacman/pkg, which can grow to many gigabytes. A weekly timer can trim it to the last three versions of each package."
categories = ["updates", "boot"]
systems = ["arch-and-based"]
keywords = ["paccache", "paccache.timer", "pacman-contrib", "/var/cache/pacman/pkg", "pacman -Sc", "package cache", "disk space"]
symptoms = ["disk is full", "root partition full", "/var/cache/pacman/pkg is huge", "how to free disk space", "pacman cache too big"]
source = "https://wiki.archlinux.org/title/System_maintenance#Package_cache"

[[fixed_when]]
any_of = [
  { source = "service", name = "paccache.timer", state = "enabled" },
  { source = "file", path = "/etc/pacman.d/hooks/*.hook", contains = "paccache" },
  { source = "file", path = "/usr/share/libalpm/hooks/*.hook", contains = "paccache" },
]

# A disabled timer is the default and harmless on a roomy disk, so on its own it stays below 50%.
[[signals]]
says = "paccache.timer is installed but disabled"
weight = 0.2
source = "service"
name = "paccache.timer"
state = "disabled"

[[signals]]
says = "The disk holding the package cache is at least 90% full"
weight = 0.45
source = "command"
argv = ["df", "--output=pcent", "/var/cache/pacman/pkg"]
exit = 0
regex = '^\s*(9\d|100)%$'

[[fix]]
systems = ["arch-and-based"]
steps = [
  { op = "install", packages = ["pacman-contrib"] },
  { op = "service", names = ["paccache.timer"], now = true, says = "Trim the package cache every week (paccache.timer)" },
]
