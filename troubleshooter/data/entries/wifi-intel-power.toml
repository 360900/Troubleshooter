id = "wifi-intel-power"
title = "Intel Wi-Fi drops or stalls"
summary = "The Intel Wi-Fi firmware logged errors. Running it in its most active power mode often stops the stalls, at a small battery cost."
categories = ["network", "intel", "drivers"]
systems = ["any"]
keywords = ["intel", "iwlwifi", "iwlmvm", "ax200", "ax210", "be200", "power_scheme", "microcode error"]
symptoms = ["wifi keeps disconnecting", "wifi stalls for a few seconds", "wireless drops every few minutes", "internet cuts out on my laptop"]
auto_detect = true
reproduce = "Use the internet normally until the connection drops."
source = "https://wiki.archlinux.org/title/Network_configuration/Wireless#iwlwifi"

# power_scheme only exists in iwlmvm and iwlmld (newer cards). Older iwldvm cards lack it.
[[when]]
source = "module"
names = ["iwlmvm", "iwlmld"]

[[fixed_when]]
any_of = [
  { source = "file", path = "/sys/module/iwlmvm/parameters/power_scheme", regex = '^1$' },
  { source = "file", path = "/sys/module/iwlmld/parameters/power_scheme", regex = '^1$' },
]

# A firmware crash has many causes (the first remedy is newer firmware) and the driver
# restarts the firmware by itself, so one from hours ago doesn't recommend trading battery
# life on launch. Seen while the user reproduces the drops, it does.
[[signals]]
says = "The kernel log shows Intel Wi-Fi firmware errors"
weight = 0.45
source = "journal"
kernel = true
# pcie/rx.c and pcie/tx.c
regex = 'iwlwifi \S+: (Microcode SW error detected|Queue \d+ is stuck|Hardware error detected|Error sending \S+: time out)'

[[fix]]
reboot = true
steps = [
  { op = "module_options", module = "iwlmvm", options = ["power_scheme=1"], says = "Run the Wi-Fi chip in its most active power mode" },
  { op = "module_options", module = "iwlmld", options = ["power_scheme=1"], says = "Do the same for newer chips that use iwlmld" },
]
