id = "game-crash-coredump"
title = "A game or Windows app crashed"
summary = "A game or Wine process crashed. The log doesn't point to a system-wide cause, so this usually comes down to that game or its Proton version."
categories = ["games", "wine", "crashes"]
systems = ["any"]
keywords = ["coredump", "segfault", "proton log", "wine crash", "exe crash"]
symptoms = ["game crashes", "game closes without an error", "steam game won't stay open", "windows app crashes under wine"]
advice = "In Steam, try another Proton version under Properties, Compatibility. Add PROTON_LOG=1 %command% to the launch options to get a log in your home folder. Search ProtonDB for this game's known launch options."
reproduce = "Start the game or app and do what makes it crash."

[[signals]]
says = "A game or Wine process crashed during this boot"
weight = 0.7
source = "journal"
# Process names are cut to 15 characters, so a long Game.exe shows up as "Game.e". Steam's
# own processes (steamwebhelper crashes often and harmlessly) aren't games.
regex = 'Process \d+ \(([^)]*(wine|proton)[^)]*|[^)]*\.(e|ex|exe))\) of user \d+ dumped core|(wine\S*|\S*\.(e|ex|exe))\[\d+\]: segfault at'
