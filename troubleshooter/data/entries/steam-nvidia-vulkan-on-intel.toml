id = "steam-nvidia-vulkan-on-intel"
title = "Steam: NVIDIA's 32-bit driver is installed on an Intel system"
summary = "Older Steam packages pulled in a 32-bit Vulkan driver, and pacman picked lib32-nvidia-utils unless you chose another. It is still installed. With Intel graphics and no NVIDIA card it can't work, and it can conflict with Intel's driver. The fix swaps it for Intel's 32-bit Vulkan driver."
categories = ["games", "intel", "wine"]
systems = ["arch-and-based"]
keywords = ["lib32-nvidia-utils", "lib32-vulkan-intel", "lib32-vulkan-driver", "vulkan", "dxvk", "DxvkError"]
symptoms = ["games won't start on intel graphics", "vulkan doesn't work in steam", "dxvk error when starting a game", "proton games crash right away", "steam installed the nvidia driver"]
auto_detect = true
source = "https://wiki.archlinux.org/title/Steam/Troubleshooting#Game_crashes_immediately"

[[when]]
any_of = [
  { source = "pci", vendor = "8086", class = "03", driver = "i915" },
  { source = "pci", vendor = "8086", class = "03", driver = "xe" },
]

[[when]]
source = "pci"
vendor = "10de"
class = "03"
absent = true

[[when]]
source = "package"
names = ["lib32-nvidia-utils", "lib32-nvidia-*-utils"]

# Laptops whose NVIDIA card is switched off (supergfxctl, envycontrol, optimus-manager)
# or unplugged eGPUs hide it from PCI. A kernel driver for it means it is still in use.
[[when]]
source = "package"
names = ["nvidia", "nvidia-dkms", "nvidia-lts", "nvidia-open", "nvidia-open-dkms", "nvidia-lts-open", "nvidia-*xx-dkms", "linux-*-nvidia*", "supergfxctl", "envycontrol", "optimus-manager*"]
absent = true

[[signals]]
says = "lib32-nvidia-utils is installed, but there is no NVIDIA card"
weight = 0.85
source = "package"
names = ["lib32-nvidia-utils", "lib32-nvidia-*-utils"]

[[signals]]
says = "A game crashed with a DXVK error"
weight = 0.5
source = "journal"
regex = "terminate called after throwing an instance of 'dxvk::DxvkError'"

[[fix]]
steps = [
  { op = "install", packages = ["vulkan-intel", "lib32-vulkan-intel"], says = "Install Intel's 64-bit and 32-bit Vulkan drivers" },
  { op = "remove", packages = ["lib32-nvidia-utils", "lib32-nvidia-*-utils"], says = "Remove the NVIDIA 32-bit driver" },
]
