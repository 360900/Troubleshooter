id = "ipv6-timesyncd-no-ipv6"
title = "Clock doesn't sync because IPv6 is turned off"
summary = "IPv6 is disabled with ipv6.disable=1, but systemd-timesyncd still picks IPv6 time servers from the 2.arch.pool.ntp.org pool and fails to reach them, so the clock may not be set. Using only the pools that serve IPv4 fixes it."
categories = ["network", "boot"]
systems = ["arch-and-based"]
keywords = ["systemd-timesyncd", "ipv6.disable=1", "ntp", "pool.ntp.org", "timesyncd.conf", "address family not supported by protocol", "time sync"]
symptoms = ["clock not syncing", "time is wrong", "timesyncd not working", "clock drifts after disabling ipv6"]
auto_detect = true
source = "https://wiki.archlinux.org/title/IPv6#systemd-timesyncd"

[[when]]
source = "cmdline"
regex = '(^|\s)ipv6\.disable=1(\s|$)'

[[when]]
source = "service"
name = "systemd-timesyncd.service"
state = "enabled"

[[when]]
source = "file"
path = "/etc/systemd/timesyncd.conf"
regex = '^\s*NTP\s*=\s*\S'
absent = true

[[fixed_when]]
source = "file"
path = "/etc/systemd/timesyncd.conf.d/troubleshooter-ipv4-ntp.conf"

[[signals]]
says = "systemd-timesyncd tried an IPv6 time server although IPv6 is disabled"
weight = 0.8
source = "journal"
identifier = "systemd-timesyncd"
regex = 'Failed to set up connection socket: Address family not supported by protocol'

[[fix]]
steps = [
  { op = "write_file", path = "/etc/systemd/timesyncd.conf.d/troubleshooter-ipv4-ntp.conf", content = "[Time]\nNTP=0.arch.pool.ntp.org 1.arch.pool.ntp.org 3.arch.pool.ntp.org\nFallbackNTP=0.pool.ntp.org 1.pool.ntp.org 3.pool.ntp.org\n", says = "Use only time server pools that answer over IPv4" },
  { op = "command", says = "Restart systemd-timesyncd", run = "systemctl try-restart systemd-timesyncd.service", undo = "systemctl try-restart systemd-timesyncd.service" },
]
