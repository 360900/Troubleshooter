id = "keyring-password-mismatch"
title = "Keyring: login keyring password doesn't match"
summary = "After a password change, the GNOME login keyring still uses the old password, so it isn't unlocked at login and apps keep asking for a keyring password."
categories = ["desktop"]
systems = ["arch-and-based"]
keywords = ["gnome-keyring", "login keyring", "seahorse", "pam_gnome_keyring", "login.keyring", "unlock keyring", "gkr-pam"]
symptoms = ["the password you use to login no longer matches that of your login keyring", "asks for keyring password every login", "enter password to unlock your login keyring", "keyring prompt after changing password", "chrome asks to unlock keyring"]
source = "https://wiki.archlinux.org/title/GNOME/Keyring#Resetting_the_keyring"
advice = "Open Passwords and Keys (seahorse), right-click the Login keyring, choose Change Password, enter the old password and set it to your current login password. If you don't remember the old one, delete login.keyring and user.keystore in ~/.local/share/keyrings/ and log in again; this erases all saved passwords."

[[when]]
source = "package"
names = ["gnome-keyring"]

[[signals]]
says = "The keyring PAM module couldn't unlock the login keyring at login"
weight = 0.3
source = "journal"
regex = "gkr-pam: couldn't unlock the login keyring"
