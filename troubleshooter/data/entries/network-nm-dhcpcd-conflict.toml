id = "network-nm-dhcpcd-conflict"
title = "Network: dhcpcd and NetworkManager both start on their own"
summary = "dhcpcd.service is enabled next to NetworkManager. Both try to configure the same connection, which causes lost addresses, drops and slow connections."
categories = ["network"]
systems = ["arch-and-based"]
keywords = ["dhcpcd", "dhcpcd.service", "networkmanager", "dhcp", "conflict", "ip address"]
symptoms = ["internet keeps dropping", "connected but no internet", "wifi connects and drops over and over", "ip address keeps changing", "ethernet doesn't get an address"]
auto_detect = true
source = "https://wiki.archlinux.org/title/NetworkManager#DHCP_client"

[[when]]
source = "package"
names = ["networkmanager"]

[[when]]
source = "package"
names = ["dhcpcd"]

[[when]]
source = "service"
name = "NetworkManager.service"
state = "enabled"

[[fixed_when]]
source = "service"
name = "dhcpcd.service"
state = "disabled"

[[signals]]
says = "dhcpcd.service is enabled although NetworkManager manages the network"
weight = 0.85
source = "service"
name = "dhcpcd.service"
state = "enabled"

[[fix]]
reboot = true
steps = [{ op = "service", action = "disable", names = ["dhcpcd.service"], says = "Stop dhcpcd from starting on its own" }]
