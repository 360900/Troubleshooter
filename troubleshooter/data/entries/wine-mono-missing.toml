id = "wine-mono-missing"
title = "Wine is missing Mono and Gecko"
summary = "Many Windows apps need .NET or an embedded browser. Wine gets those from wine-mono and wine-gecko. Without them, apps crash or fail to install."
categories = ["wine", "games"]
systems = ["arch-and-based"]
keywords = ["wine-mono", "wine-gecko", "dotnet", ".net", "mscoree"]
symptoms = ["windows app won't start in wine", "installer fails under wine", ".net app crashes", "wine asks to download mono", "exe doesn't open"]
auto_detect = true
source = "https://wiki.archlinux.org/title/Wine#Installation"

# The wine-mono package is built for the repo's wine. Other builds such as wine-cachyos
# or wine-ge-custom can want a different Mono version and download their own.
[[when]]
source = "package"
names = ["wine", "wine-staging"]

[[fixed_when]]
source = "package"
names = ["wine-mono"]

# Wine already installed Mono into the default prefix when it offered to.
[[fixed_when]]
source = "file"
path = "~/.wine/drive_c/windows/mono"

# Wine also finds a shared copy here, whichever package put it there.
[[fixed_when]]
source = "file"
path = "/usr/share/wine/mono/wine-mono-*"

# Without a prefix, Wine hasn't run yet, and it offers to download Mono the first time it does.
[[signals]]
says = "Wine is installed, but wine-mono isn't"
weight = 0.3
source = "package"
names = ["wine-mono"]
absent = true

[[signals]]
says = "Your Wine prefix (~/.wine) was set up without Mono, so .NET apps in it can't run"
weight = 0.4
source = "file"
path = "~/.wine/system.reg"

[[fix]]
steps = [{ op = "install", packages = ["wine-mono", "wine-gecko"] }]
