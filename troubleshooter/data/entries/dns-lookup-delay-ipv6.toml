id = "dns-lookup-delay-ipv6"
title = "DNS: every new website takes about 5 seconds to start loading"
summary = "Some routers and firewalls answer only one of the two lookups (IPv4 and IPv6) that are sent at the same time, so each name lookup waits for a 5-second timeout. Sending the lookups one after the other avoids it."
categories = ["network"]
systems = ["arch-and-based"]
keywords = ["dns", "resolv.conf", "single-request", "timeout", "aaaa", "ipv6", "glibc resolver", "dns-options", "nmcli"]
symptoms = ["websites take 5 seconds to load", "slow dns lookups", "every page loads after a delay", "pacman slow to start downloading", "name resolution is slow"]
advice = "Add the line options single-request to /etc/resolv.conf. If NetworkManager writes that file, set it on the connection instead with nmcli connection modify NAME +ipv4.dns-options single-request and reconnect. This doesn't apply when systemd-resolved does the lookups."
source = "https://wiki.archlinux.org/title/Domain_name_resolution#Hostname_lookup_delayed_with_IPv6"

# With systemd-resolved's stub in resolv.conf, resolved sends the lookups, not glibc.
[[when]]
source = "file"
path = "/etc/resolv.conf"
regex = '^nameserver\s+127\.0\.0\.53\b'
absent = true

[[fixed_when]]
source = "file"
path = "/etc/resolv.conf"
regex = '^\s*options\s.*\bsingle-request'
