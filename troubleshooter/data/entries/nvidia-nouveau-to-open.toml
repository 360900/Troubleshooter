id = "nvidia-nouveau-to-open"
title = "NVIDIA card is using nouveau instead of the NVIDIA driver"
summary = "Your card is new enough for NVIDIA's open kernel driver. It's running on nouveau, which works well for the desktop but is slower in many games and has no CUDA, NVENC or DLSS. If you chose nouveau on purpose, keep it."
categories = ["nvidia", "drivers", "display", "games"]
systems = ["arch-and-based"]
keywords = ["nouveau", "nvidia-open", "proprietary driver", "install nvidia driver", "turing", "ampere"]
symptoms = ["low fps on nvidia", "games are slow on my rtx card", "nvidia driver not installed", "nvidia settings doesn't open", "no cuda", "screen flickers on nvidia"]
auto_detect = true
source = "https://wiki.archlinux.org/title/NVIDIA#Installation"

[[when]]
source = "pci"
vendor = "10de"
class = "03"
devices = ["1e00-ffff"]

# An older card next to it would lose its driver: the open driver can't run anything
# before Turing, and NVIDIA's packages turn nouveau off for every card.
[[when]]
source = "pci"
vendor = "10de"
class = "03"
devices = ["0000-1dff"]
absent = true

[[when]]
source = "pci"
vendor = "10de"
class = "03"
devices = ["1e00-ffff"]
driver = "nouveau"

[[fixed_when]]
source = "module"
names = ["nvidia"]

# Since Linux 6.18, nouveau reclocks Turing and newer through GSP and has Vulkan (NVK), so
# it's a reasonable choice for a desktop. Recommend switching only for what it lacks.
[[signals]]
says = "Games or Wine are installed, and they run better on NVIDIA's driver"
weight = 0.6
source = "package"
names = ["steam", "lutris", "heroic-games-launcher*", "bottles", "wine", "wine-*", "proton*", "umu-launcher"]

[[signals]]
says = "Software that needs CUDA is installed, which nouveau can't run"
weight = 0.7
source = "package"
names = ["cuda", "cuda-tools", "ollama-cuda", "python-pytorch-cuda", "python-pytorch-opt-cuda", "blender-cuda*"]

[[signals]]
says = "The kernel log shows nouveau errors"
weight = 0.6
source = "journal"
kernel = true
regex = 'nouveau [0-9a-f:.]+: (fifo|gr|mmu|gsp|disp|fb|bus)\b.*(fault|TRAP|error|timeout|timed out)|nouveau [0-9a-f:.]+: .*(failed to idle channel|channel .* killed|lockup)'

[[fix]]
reboot = true
steps = [
  { op = "install", packages = ["nvidia-open-dkms", "nvidia-utils", "{headers}"], optional = { "lib32-nvidia-utils" = ["steam", "wine", "wine-*", "lutris"] }, says = "Install the NVIDIA open driver for your kernels" },
  { op = "remove", packages = ["xf86-video-nouveau"], says = "Remove the old nouveau X driver" },
  { op = "initramfs" },
]
