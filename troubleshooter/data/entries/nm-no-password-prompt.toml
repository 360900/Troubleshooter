id = "nm-no-password-prompt"
title = "Wi-Fi: no password prompt when connecting"
summary = "NetworkManager needs a helper in your session to ask for Wi-Fi passwords and store them. Without one, connecting to a secured network fails silently."
categories = ["network", "desktop"]
systems = ["arch-and-based"]
keywords = ["gnome-keyring", "secret agent", "nm-applet", "no agents were available", "keyring", "kwallet"]
symptoms = ["no password prompt for wifi", "can't connect to secured wifi", "wifi asks for nothing and fails", "secrets were required but not provided", "wifi password not saved"]
advice = "Install gnome-keyring (or use KWallet on KDE) and log in again. If you use a window manager without a desktop, also start nm-applet in your session so something can ask you for the password. You can also connect from a terminal with nmcli device wifi connect NAME password PASSWORD."
reproduce = "Try to connect to the secured Wi-Fi network again."
source = "https://wiki.archlinux.org/title/NetworkManager#No_prompt_for_password_of_secured_Wi-Fi_networks"

[[when]]
source = "package"
names = ["networkmanager"]

[[signals]]
says = "NetworkManager found nothing in your session that can ask for the password"
weight = 0.6
source = "journal"
regex = 'NetworkManager.*No agents were available for this request'

[[signals]]
says = "No keyring is installed to store passwords"
weight = 0.2
source = "package"
names = ["gnome-keyring", "kwallet", "kwallet6", "keepassxc"]
absent = true
