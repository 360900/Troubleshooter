id = "pacman-db-locked"
title = "Updates: package database is locked"
summary = "pacman leaves a lock file behind when an update is interrupted, and every later update then refuses to start. Removing the lock is safe once no package manager is running."
categories = ["updates"]
systems = ["arch-and-based"]
keywords = ["db.lck", "unable to lock database", "failed to init transaction", "pacman", "pamac", "lock file"]
symptoms = ["pacman says unable to lock database", "can't update, database is locked", "failed to init transaction", "updates won't start after a crash", "software center says another update is running"]
source = "https://wiki.archlinux.org/title/Pacman#%22Failed_to_init_transaction_(unable_to_lock_database)%22_error"

[[when]]
source = "file"
path = "/etc/pacman.conf"

[[fixed_when]]
source = "file"
path = "/var/lib/pacman/db.lck"
absent = true

[[signals]]
says = "The pacman lock file is present"
weight = 0.6
source = "file"
path = "/var/lib/pacman/db.lck"

[[signals]]
says = "pacman is running right now, so the lock is probably in use"
weight = 0.9
counter = true
source = "file"
path = "/proc/[0-9]*/comm"
regex = '^pacman$'

[[fix]]
steps = [{ op = "command", says = "Remove the stale lock file, after checking that no package manager is using it", run = "if fuser -s /var/lib/pacman/db.lck 2>/dev/null || pgrep -x pacman >/dev/null; then echo 'A package manager is still running. Let it finish, then try again.' >&2; exit 1; fi; rm -f /var/lib/pacman/db.lck" }]
