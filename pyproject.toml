[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "troubleshooter"
version = "0.2.0"
description = "Finds and fixes common Linux problems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
dependencies = ["PySide6"]

[project.scripts]
troubleshooter = "troubleshooter.__main__:main"
troubleshooter-cli = "troubleshooter.interactive:main"

[tool.setuptools.packages.find]
include = ["troubleshooter*"]

[tool.setuptools.package-data]
troubleshooter = ["data/*", "data/entries/*", "ui/assets/*", "ui/assets/*/*"]
